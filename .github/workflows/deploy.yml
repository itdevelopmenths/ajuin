name: Deploy to VPS

on:
  push:
    branches:
      - main # Ubah ke branch yang sesuai jika perlu (misal: master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }} # Biasanya 22
          source: "."
          target: "/var/www/ERP/apps/ajuin/ajuin"
          # Kita tidak menggunakan 'rm: true' agar file .env di server tidak ikut terhapus

      - name: Execute Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/ERP/apps/ajuin
            
            # Build ulang dan jalankan container
            docker compose up -d --build
            
            # Membersihkan image yang menggantung (dangling) agar disk space tidak penuh
            docker image prune -f
